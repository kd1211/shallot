<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shallot Sandbox Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Arial", sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.8;
            max-width: 300px;
        }

        #ui h2 {
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        #ui p {
            margin: 5px 0;
            color: #ccc;
        }

        #ui .control {
            color: #aaa;
            font-size: 12px;
            margin-top: 2px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }

        #block-info {
            position: absolute;
            top: 50%;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-left: 4px solid #4fc3f7;
            border-radius: 4px;
            color: #4fc3f7;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>🎮 Sandbox Game</h2>
        <p><strong>Controls:</strong></p>
        <p class="control"><strong>WASD</strong> - Move</p>
        <p class="control"><strong>Space</strong> - Up</p>
        <p class="control"><strong>Shift</strong> - Down</p>
        <p class="control"><strong>Mouse</strong> - Look around</p>
        <p class="control"><strong>Click</strong> - Place block</p>
        <p class="control"><strong>Right Click</strong> - Destroy block</p>
        <p class="control"><strong>1-4</strong> - Select block type</p>
        <p class="control"><strong>[ ]</strong> - Cycle blocks</p>
    </div>
    <div id="crosshair"></div>
    <div id="block-info">Selected: Grass (1)</div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
